name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Qualify Intel source installation
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        timeout-minutes: 60
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -euo pipefail
          : "${GITHUB_SHA:?GitHub candidate commit is required}" "${RUNNER_TEMP:?Runner temporary directory is required}"
          {
            architecture="$(uname -m)"
            test "${architecture}" = "x86_64"
            sw_vers
            tap_path="$(brew --repo wbsmolen/columbia)"
            git -C "${tap_path}" diff --exit-code "${GITHUB_SHA}" -- Formula/columbia.rb
            expected_version="$(brew info --formula --json=v2 wbsmolen/columbia/columbia | ruby -rjson -e 'print JSON.parse(STDIN.read).fetch("formulae").first.fetch("versions").fetch("stable")')"
            brew install --formula --only-dependencies --include-test --verbose wbsmolen/columbia/columbia
            if brew list --formula --versions wbsmolen/columbia/columbia >/dev/null 2>&1
            then
              brew reinstall --formula --build-from-source --verbose wbsmolen/columbia/columbia
            else
              brew install --formula --build-from-source --verbose wbsmolen/columbia/columbia
            fi
            git -C "${tap_path}" diff --exit-code "${GITHUB_SHA}" -- Formula/columbia.rb
            installed_prefix="$(brew --prefix wbsmolen/columbia/columbia)"
            installed_version="$("${installed_prefix}/bin/columbia" version)"
            test "${installed_version}" = "columbia ${expected_version}"
            brew list --versions go node wbsmolen/columbia/columbia
            brew linkage --test wbsmolen/columbia/columbia
            brew test --verbose wbsmolen/columbia/columbia
          } 2>&1 | tee "${RUNNER_TEMP}/columbia-intel-source-qualification.log"

      - name: Retain Intel source qualification log
        if: always() && github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-source-qualification
          path: ${{ runner.temp }}/columbia-intel-source-qualification.log

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
